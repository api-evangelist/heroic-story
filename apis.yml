description: 'Heroic Story was a Web3 gaming studio building a collaborative, community-owned
  tabletop role-playing game world — a Dungeons & Dragons-style on-chain MMORPG powered by
  smart contracts and NFTs on Polygon. Founded by Jay and Scott Rosenkrantz, it raised a
  $6M seed round in November 2022 led by Upfront Ventures with participation from Multicoin
  Capital and Polygon, bringing total financing to roughly $7.4M. As of this profiling the
  primary domain heroicstory.com resolves to a parked GoDaddy lander with no active product,
  documentation, developer, or API surface, indicating the project is dormant or defunct.'
